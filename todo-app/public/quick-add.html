<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>快速添加备注</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      background: transparent;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      overflow: hidden;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
      overflow: hidden;
    }

    .header {
      padding: 16px 18px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      color: #5c3ec5;
    }

    .header h2 {
      font-size: 14px;
      font-weight: 700;
      color: #1a1a2e;
    }

    .title-preview {
      margin: 0 18px 10px;
      padding: 8px 12px;
      background: rgba(92, 62, 197, 0.06);
      border-radius: 8px;
      font-size: 13px;
      color: #555;
      max-height: 40px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.4;
    }

    .input-section {
      flex: 1;
      padding: 0 18px;
      display: flex;
      flex-direction: column;
    }

    .input-label {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    textarea {
      flex: 1;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(12px) saturate(150%);
      -webkit-backdrop-filter: blur(12px) saturate(150%);
      font-size: 13px;
      color: #1a1a2e;
      resize: none;
      min-height: 50px;
      font-family: inherit;
      transition: border-color 0.2s, background 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: #5c3ec5;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 0 3px rgba(92, 62, 197, 0.1);
    }

    textarea::placeholder {
      color: #aaa;
    }

    .actions {
      display: flex;
      gap: 10px;
      padding: 12px 18px 16px;
    }

    .btn {
      flex: 1;
      padding: 9px 0;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-skip {
      background: rgba(0, 0, 0, 0.06);
      color: #666;
    }

    .btn-skip:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    .btn-confirm {
      background: #5c3ec5;
      color: #fff;
      box-shadow: 0 2px 8px rgba(92, 62, 197, 0.3);
    }

    .btn-confirm:hover {
      background: #4a2eb0;
      box-shadow: 0 4px 12px rgba(92, 62, 197, 0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 11l3 3L22 4" />
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
      </svg>
      <h2>已添加到待办</h2>
    </div>
    <div class="title-preview" id="titlePreview"></div>
    <div class="input-section">
      <div class="input-label">备注（可选）</div>
      <textarea id="notesInput" placeholder="添加备注信息..." maxlength="1000"></textarea>
    </div>
    <div class="actions">
      <button class="btn btn-skip" id="skipBtn">跳过</button>
      <button class="btn btn-confirm" id="confirmBtn">确认备注</button>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const title = params.get("title") || "";
    document.getElementById("titlePreview").textContent = title;

    const notesInput = document.getElementById("notesInput");
    const confirmBtn = document.getElementById("confirmBtn");
    const skipBtn = document.getElementById("skipBtn");

    // 自动聚焦到输入框
    setTimeout(() => notesInput.focus(), 100);

    confirmBtn.addEventListener("click", () => {
      window.electronAPI.confirmNotes(notesInput.value);
    });

    skipBtn.addEventListener("click", () => {
      window.electronAPI.skipNotes();
    });

    // Ctrl+Enter 确认
    notesInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        window.electronAPI.confirmNotes(notesInput.value);
      }
    });

    // Escape 跳过
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        window.electronAPI.skipNotes();
      }
    });
  </script>
</body>
</html>
